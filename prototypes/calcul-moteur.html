<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — Choix d'interface craft · Albion52</title>
<style>
  :root{
    --accent:#d9a441; --bg:#141117; --panel:#1f1b27; --panel2:#282231; --line:#3a3343;
    --fg:#ece6f0; --muted:#a69bb2; --pos:#63b85f; --neg:#d15b5b; --blue:#6aaed8;
    --silver:#d6dae0; --silver-hi:#f0f2f5; --time:#8fc7de;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:radial-gradient(1200px 800px at 70% -10%, #1c1626 0%, var(--bg) 55%);color:var(--fg);
    font-family:system-ui,Segoe UI,Roboto,sans-serif;line-height:1.45}
  .app{max-width:460px;margin:0 auto;padding:16px 14px 90px}
  .tag{display:inline-block;background:#0006;border:1px solid var(--line);color:var(--muted);
    font-size:.68rem;letter-spacing:.08em;padding:2px 8px;border-radius:999px}
  .banner{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
    padding:9px 12px;border-radius:8px;font-size:.78rem;color:var(--muted);margin:10px 0 16px}
  /* ---------- composants communs ---------- */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .topbar .title{font-weight:700;font-size:1.05rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.pos{color:var(--pos);border-color:var(--pos);background:#0f2010}
  .pill.neg{color:var(--neg);border-color:var(--neg);background:#221011}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;
    box-shadow:0 3px 14px #0002}
  .card h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px;font-weight:700}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-size:.9rem}
  .row+.row{border-top:1px solid var(--line)}
  .row .val{font-variant-numeric:tabular-nums;font-weight:600}
  .row .ingr{display:flex;align-items:center;gap:8px}
  /* ---------- navigateur d'items ---------- */
  .crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .crumb button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:3px 9px;font-size:.72rem;cursor:pointer}
  .crumb button.on{color:var(--accent);border-color:var(--accent)}
  .crumb .sep{color:var(--line)}
  .btiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .btile{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
    border-radius:11px;padding:9px 10px;cursor:pointer;text-align:left;color:var(--fg);transition:border-color .15s,transform .12s,background .15s}
  .btile:hover{background:#2b2536}
  .btile:active{transform:scale(.98)}
  .btile .t-n{font-size:.82rem;font-weight:700;line-height:1.2}
  .btile .t-d{font-size:.66rem;color:var(--muted);margin-top:1px}
  .btile .go{margin-left:auto;color:var(--muted);font-size:.9rem}
  .btile.sel{border-color:var(--accent);background:#2a2216}
  .btile.sel .t-n{color:var(--accent)}
  .selbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--accent);
    border-radius:10px;padding:9px 12px;margin-bottom:10px}
  .selbar .s-name{font-weight:700;font-size:.9rem}
  .selbar .s-id{font-size:.68rem;color:var(--muted)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips .lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;align-self:center;margin-right:2px}
  .chip{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:999px;
    padding:4px 11px;font-size:.76rem;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .chip:hover{color:var(--fg)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#1c1305;font-weight:700}
  .reset{display:flex;align-items:center;gap:6px;border:1px solid var(--neg);color:var(--neg);background:#221011;
    border-radius:999px;padding:5px 11px;font-size:.76rem;cursor:pointer;margin-left:auto}
  /* ---------- arbre d'ingrédients (sources + sous-recettes) ---------- */
  .src{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
  .src button{border:none;background:transparent;color:var(--muted);border-radius:6px;padding:4px 7px;font-size:.72rem;cursor:pointer}
  .src button.on{background:var(--accent);color:#1c1305;font-weight:700}
  .src button:disabled{opacity:.35;cursor:not-allowed}
  .tree{display:flex;flex-direction:column}
  .node{padding:7px 0;border-bottom:1px solid var(--line)}
  .node:last-child{border-bottom:none}
  .node-head{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .node-label{display:flex;align-items:center;gap:8px;min-width:0}
  .node-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}
  .node-cost{font-size:.84rem;font-variant-numeric:tabular-nums}
  .branch{border-left:1px solid var(--line);margin-left:22px;padding-left:10px;margin-top:4px}
  .node-sub{font-size:.74rem;color:var(--muted);margin-left:30px;margin-top:2px}
  .ingr-sum{font-size:.74rem;color:var(--muted);margin-left:30px;margin-top:2px;display:flex;gap:10px}
  .num-big{font-size:1.75rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .num-big .money{font-size:1.75rem}
  .num{font-variant-numeric:tabular-nums}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)} .accent{color:var(--accent)}
  .hint{font-size:.75rem;color:var(--muted)}
  .sub-h{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 6px;border-top:1px solid var(--line);padding-top:12px}
  .money{color:var(--silver);font-family:Georgia,'Times New Roman',Cambria,serif;font-weight:700;letter-spacing:.01em;
    text-shadow:0 0 14px rgba(214,218,224,.18)}
  .pos .money,.pos.money{color:var(--pos)}
  .neg .money,.neg.money{color:var(--neg)}
  .time{color:var(--time);font-variant-numeric:tabular-nums;font-weight:700;font-size:.92rem;white-space:nowrap}
  .time i{font-style:normal;font-size:.72em;opacity:.85;margin-right:1px}
  button{font-family:inherit}
  .btn{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-size:.9rem;cursor:pointer;transition:border-color .15s,filter .15s}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(135deg,#c89b3c,#d9a441);border-color:#c89b3c;color:#1c1305;font-weight:700}
  .btn.block{width:100%}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepper button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-size:1rem;cursor:pointer;transition:border-color .15s}
  .stepper .val{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
  .stepper input.qty{width:64px;height:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--fg);font-size:.9rem;padding:0 4px;transition:border-color .15s}
  .stepper input.qty:focus{outline:none;border-color:var(--accent)}
  .stepper input.qty::-webkit-outer-spin-button,.stepper input.qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper input.qty{appearance:textfield}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
  .seg button{flex:1;border:none;background:transparent;color:var(--muted);border-radius:8px;padding:7px 8px;font-size:.82rem;cursor:pointer;transition:background .15s,color .15s}
  .seg button.on{background:var(--accent);color:#1c1305;font-weight:700}
  .switch{position:relative;width:44px;height:26px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .switch .sl{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line);border-radius:999px;transition:.15s}
  .switch .sl:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:.15s}
  .switch input:checked + .sl{background:var(--accent);border-color:var(--accent)}
  .switch input:checked + .sl:before{transform:translateX(18px);background:#1c1305}
  .tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:0 2px 10px #0003}
  .tile .k{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .tile .v{font-weight:700;font-size:.95rem;margin-top:4px;font-variant-numeric:tabular-nums}
  .tile .v .money{font-size:1rem}
  .tile.rev .k{color:var(--silver)}
  .tile.profit .k{font-weight:800}
  .tile.profit .v{font-size:1.05rem}
  details{border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-top:10px}
  details summary{cursor:pointer;padding:10px 12px;font-size:.85rem;color:var(--muted);list-style:none}
  details summary::-webkit-details-marker{display:none}
  details[open] summary{border-bottom:1px solid var(--line)}
  .inset{padding:4px 12px 10px}
  table{width:100%;border-collapse:collapse;font-size:.84rem}
  th{color:var(--muted);text-align:left;font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
  th,td{padding:5px 2px;border-bottom:1px solid var(--line)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  /* ---------- variante B : assistant ---------- */
  .progress{display:flex;justify-content:center;gap:10px;margin:4px 0 18px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
  .dot.on{background:var(--accent);border-color:var(--accent)}
  .dot.done{background:var(--muted)}
  .pick-card{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;color:var(--fg);cursor:pointer}
  .pick-card .n{font-weight:700}
  .pick-card .d{font-size:.8rem;color:var(--muted);margin-top:2px}
  .pick-card.sel{border-color:var(--accent)}
  .pick-card.sel .n{color:var(--accent)}
  .big-verdict{text-align:center;padding:20px 14px}
  /* ---------- variante C : tableau de bord ---------- */
  .mini{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
  .badge{width:42px;height:42px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem}
  .ic{width:44px;height:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);object-fit:cover;display:block}
  .ic-sm{width:22px;height:22px;border-radius:6px}
  /* ---------- tooltips (point d'interrogation) ---------- */
  .tip{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;
    width:15px;height:15px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);
    font-size:.6rem;font-weight:800;line-height:1;cursor:help;vertical-align:middle;margin-left:5px;user-select:none}
  .tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);
    background:#000e;color:var(--fg);border:1px solid var(--accent);border-radius:10px;padding:9px 11px;
    font-size:.75rem;font-weight:400;line-height:1.5;width:230px;max-width:74vw;text-align:left;
    white-space:normal;z-index:50;box-shadow:0 8px 24px #000a;opacity:0;pointer-events:none;transition:opacity .12s}
  .tip::before{content:"";position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);
    border:5px solid transparent;border-top-color:var(--accent);opacity:0;pointer-events:none;transition:opacity .12s}
  .tip:hover::after,.tip:focus::after,.tip:hover::before,.tip:focus::before{opacity:1}
  .tip:focus{outline:none}
  /* ---------- icônes cliquables + infobulle (nom, tier, qualité, prix) ---------- */
  .iwrap{position:relative;display:inline-flex;flex:none}
  .iwrap>img{display:block;cursor:pointer}
  .iwrap .ibox{display:none;position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);
    background:#000f;color:var(--fg);border:1px solid var(--accent);border-radius:10px;padding:9px 11px;
    font-size:.75rem;line-height:1.5;min-width:190px;max-width:min(280px,80vw);text-align:left;
    white-space:normal;z-index:80;box-shadow:0 8px 24px #000a;pointer-events:none}
  .iwrap .ibox .ib-name{font-weight:700;font-size:.82rem}
  .iwrap .ibox .ib-id{color:var(--muted);font-size:.68rem;margin-top:1px}
  .iwrap .ibox .ib-kind{color:var(--accent);font-size:.7rem;margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
  .iwrap .ibox .ib-row{display:flex;justify-content:space-between;gap:12px;margin-top:5px;font-size:.74rem;font-variant-numeric:tabular-nums}
  .iwrap .ibox .ib-row .k{color:var(--muted)}
  .iwrap .ibox .ib-row .v{font-weight:700;color:var(--fg)}
  .iwrap .ibox .ib-row .v.pos{color:var(--pos)}
  .iwrap:hover .ibox{display:block}
  .iwrap:focus-within .ibox{display:block}
  .iwrap:focus-visible>img{outline:1px solid var(--accent);outline-offset:2px}
  /* ---------- modal popup : icône agrandie + onglets ---------- */
  .mback{position:fixed;inset:0;background:#000c;z-index:120;display:flex;align-items:flex-end;justify-content:center}
  .modal{background:var(--bg);border:1px solid var(--line);border-top:3px solid var(--accent);
    border-radius:16px 16px 0 0;width:100%;max-width:460px;max-height:88vh;overflow:auto;padding:16px;box-shadow:0 -12px 40px #000a}
  .mhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .mhead img{width:64px;height:64px;border-radius:12px;border:1px solid var(--accent);background:var(--panel2)}
  .mhead .mtitle{flex:1;min-width:0}
  .mhead .mtitle .mn{font-size:1.05rem;font-weight:800;line-height:1.2}
  .mhead .mtitle .mid{font-size:.7rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .mclose{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-size:1.05rem;cursor:pointer;flex:none}
  .mtabs{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}
  .mtabs button{flex:1;border:none;background:transparent;color:var(--muted);border-radius:8px;padding:8px 4px;font-size:.78rem;cursor:pointer;line-height:1.3;transition:background .15s,color .15s}
  .mtabs button.on{background:var(--accent);color:#1c1305;font-weight:700}
  .mtabs button small{display:block;font-size:.6rem;font-weight:400;opacity:.85}
  .mcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin-bottom:10px}
  .ing-row{display:flex;align-items:center;gap:10px;padding:8px 0}
  .ing-row+.ing-row{border-top:1px solid var(--line)}
  .ing-row .ir-name{flex:1;min-width:0;font-size:.84rem;font-weight:600}
  .ing-row .ir-id{font-size:.68rem;color:var(--muted)}
  .ing-row .ir-qty{font-weight:700;font-size:.84rem;font-variant-numeric:tabular-nums}
  .ing-row .ir-sub{font-size:.7rem;color:var(--muted)}
  .used-row{display:flex;align-items:center;gap:10px;padding:8px 0}
  .used-row+.used-row{border-top:1px solid var(--line)}
  .used-row .ur-name{flex:1;font-size:.84rem;font-weight:600}
  .used-row .ur-kind{font-size:.7rem;color:var(--muted)}
  .used-row button{border:none;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;font-size:.72rem;cursor:pointer}
  .mnote{font-size:.75rem;color:var(--muted);padding:10px 2px}
  /* ---------- barre de bascule ---------- */
  .bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
    background:#0d0a11ee;border:1px solid var(--line);border-radius:999px;padding:6px 10px;z-index:99;box-shadow:0 8px 28px #000a;backdrop-filter:blur(8px)}
  .bar button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font-size:1rem;cursor:pointer;transition:border-color .15s}
  .bar .lbl{color:var(--accent);font-size:.8rem;font-weight:700;min-width:150px;text-align:center}
  /* ---------- desktop ---------- */
  @media (min-width:960px){
    .app{max-width:1180px}
    #app.layout{display:grid;grid-template-columns:370px minmax(0,1fr);gap:18px;align-items:start}
    #app.layout>.side{grid-column:1;grid-row:1/-1;position:sticky;top:14px;align-self:start;display:flex;flex-direction:column;gap:12px}
    #app.layout>:not(.side){grid-column:2;min-width:0}
    #app.solo{max-width:780px}
    #app.solo .btiles{grid-template-columns:repeat(3,1fr)}
    .mback{align-items:center;padding:26px}
    .modal{max-width:620px;border-radius:18px}
    .mhead img{width:72px;height:72px}
    .bar .lbl{min-width:190px}
  }
  @media (hover:hover){
    .btile:hover{border-color:var(--accent);transform:translateY(-1px)}
    .btile:active{transform:scale(.97)}
    .chip:hover{border-color:var(--accent);color:var(--fg)}
    .btn:hover{border-color:var(--accent)}
    .btn.primary:hover{filter:brightness(1.08)}
    .crumb button:hover{color:var(--accent)}
    .mclose:hover{background:var(--accent);color:#1c1305}
    .mtabs button:hover{color:var(--accent)}
    .stepper button:hover{border-color:var(--accent);color:var(--accent)}
    .pick-card:hover{border-color:var(--accent)}
    .used-row button:hover{border-color:var(--accent);color:var(--accent)}
    .bar button:hover{border-color:var(--accent);color:var(--accent)}
    .src button:hover{color:var(--fg)}
    details summary:hover{color:var(--fg)}
    .reset:hover{background:var(--neg);color:#fff}
  }
</style>
</head>
<body>
<div class="app">
  <span class="tag">PROTOTYPE · jetable</span>
  <div class="banner">Choisis ton interface : <b>A</b> verdict d'abord, <b>B</b> assistant pas-à-pas, <b>C</b> tableau de bord.
  La logique de calcul est la même partout (chiffres de démo). Sélectionne un item via le navigateur, puis règle tier, enchantement, qualité.
  Bascule en bas de l'écran ou avec <b>←</b> / <b>→</b>.</div>
  <div id="app"></div>
</div>

<div class="bar">
  <button id="prev" aria-label="Variante précédente">‹</button>
  <span class="lbl" id="lbl">A — Verdict</span>
  <button id="next" aria-label="Variante suivante">›</button>
</div>

<div id="modal"></div>

<script>
/* ============================================================
   MODULE PUR — récupérable dans le code réel. Pas de DOM ici.
   ============================================================ */
const Calc = (() => {

  const TIERS = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8'];
  const TIER_MULT = { T2:0.35, T3:0.55, T4:1, T5:1.7, T6:2.9, T7:5, T8:8.5 };
  const ENCHANTS = [0, 1, 2, 3, 4];
  const ENCHANT_MULT = { 0:1, 1:1.7, 2:3.1, 3:5.5, 4:9.5 };

  const QUALITY_MULT = { 1:1.0, 2:1.4, 3:2.0, 4:3.0, 5:5.0 };

  const QUALITY_PROBS = {
    noFocus:  { 1:0.870, 2:0.120, 3:0.009, 4:0.001, 5:0.000 },
    withFocus:{ 1:0.540, 2:0.380, 3:0.070, 4:0.010, 5:0.000 },
  };

  const JOURNAL = {
    WARRIOR:   { name:'Journal de Guerrier',   base:34 },
    MAGE:      { name:'Journal de Mage',       base:30 },
    MERCENARY: { name:'Journal de Mercenaire', base:31 },
    TOOLMAKER: { name:"Journal d'Outilier",    base:29 },
    ORE:   { name:'Journal de Minerai', base:27 },
    HIDE:  { name:'Journal de Peaux',   base:25 },
    FIBER: { name:'Journal de Fibres',  base:24 },
    WOOD:  { name:'Journal de Bois',    base:26 },
    STONE: { name:'Journal de Pierre',  base:26 },
  };

  /* Familles d'items. kind: raw (récoltable) / refined (raffiné) / craft (fabriqué).
     recipe : [[famille ingrédient, quantité], ...] — appliqué au même tier/enchant.
     journal : profession ou ressource pour le journal consommé (kind raw : pas de journal). */
  const FAMILIES = {
    ORE:        { name:'Minerai',  kind:'raw',     base:42 },

  /* Arbre de navigation récursif : catégorie -> sous-catégorie -> famille d'items.
     Chaque noeud a `subs` (plus de catégories) OU `items` (listes de familles). */
  const CATALOG = [
    { id:'weapons', name:'Armes', icon:'MAIN_SWORD', subs:[
      { id:'melee', name:'Mêlée', subs:[
        { id:'swords',   name:'Épées',    items:['MAIN_SWORD'] },

      ]},
      { id:'cloth', name:'Tissu', subs:[
        { id:'c_head', name:'Capuches', items:['HEAD_CLOTH_SET1'] },
        { id:'c_body', name:'Robes',    items:['ARMOR_CLOTH_SET1'] },
        { id:'c_shoe', name:'Bottes',   items:['SHOES_CLOTH_SET1'] },
      ]},
      { id:'plate', name:'Plaque', subs:[
        { id:'p_head', name:'Casques',  items:['HEAD_PLATE_SET1'] },
        { id:'p_body', name:'Cuirasses',items:['ARMOR_PLATE_SET1'] },
        { id:'p_shoe', name:'Bottes',   items:['SHOES_PLATE_SET1'] },
      ]},
    ]},
    { id:'tools', name:'Outils', icon:'2H_TOOL_PICK', subs:[
      { id:'t_pick',  name:'Pioche',             items:['2H_TOOL_PICK'] },
      { id:'t_knife', name:'Couteau de peau',    items:['2H_TOOL_KNIFE'] },
      { id:'t_hammer',name:'Marteau de pierre',  items:['2H_TOOL_HAMMER'] },
      { id:'t_sickle',name:'Faucille',           items:['2H_TOOL_SICKLE'] },
      { id:'t_axe',   name:'Hache de bûcheron',  items:['2H_TOOL_AXE'] },
    ]},
    { id:'accessories', name:'Accessoires', icon:'BAG', subs:[
      { id:'a_bag', name:'Sacs',  items:['BAG'] },
      { id:'a_cape',name:'Capes', items:['CAPE'] },
    ]},
    { id:'consumables', name:'Consommables', icon:'POTION_HEAL', items:['POTION_HEAL'] },
    { id:'resources', name:'Ressources', icon:'ORE', subs:[
      { id:'r_raw', name:'Brutes',    items:['ORE','HIDE','FIBER','WOOD','ROCK'] },
      { id:'r_ref', name:'Raffinées', items:['METALBAR','LEATHER','CLOTH','PLANKS','STONEBLOCK'] },
    ]},
  ];

  const GATHERABLE = Object.keys(FAMILIES).filter(f => FAMILIES[f].kind === 'raw');

  /* ---- identification des items ---- */
  const itemId = (family, tier, enchant = 0) => tier + '_' + family + (enchant ? '@' + enchant : '');
  const parseId = id => {
    const m = id.match(/^(T\d)_(.+?)(?:@(\d))?$/);
    return m ? { tier: m[1], family: m[2], enchant: m[3] ? +m[3] : 0 } : null;
  };
  const isJournal = id => parseId(id).family.indexOf('JOURNAL_') === 0;

  /* ---- prix marché (démo) : base famille × multiplicateur tier × enchant ---- */
  const priceOf = (itemId, side, sense) => {
    const p = parseId(itemId);
    let mid;
    if (isJournal(itemId)) {
      const prof = p.family.slice('JOURNAL_'.length);
      mid = (JOURNAL[prof] ? JOURNAL[prof].base : 300) * TIER_MULT[p.tier];
    } else {
      const f = FAMILIES[p.family];
      if (!f) return 0;
      mid = f.base * TIER_MULT[p.tier] * ENCHANT_MULT[p.enchant];
    }
    const bid = Math.round(mid * 0.97), ask = Math.round(mid * 1.04);
    if (side === 'buy') return sense === 'instant' ? ask : bid;
    return sense === 'instant' ? bid : ask;
  };

  const qPrice = (itemId, side, q, sense) => Math.round(priceOf(itemId, side, sense) * QUALITY_MULT[q]);
  const probsOf = s => s.focus ? QUALITY_PROBS.withFocus : QUALITY_PROBS.noFocus;
  const evPrice = (itemId, side, s) => {
    const probs = probsOf(s);
    let ev = 0; for (let q = 1; q <= 5; q++) ev += probs[q] * qPrice(itemId, side, q, s.sense);
    return Math.round(ev);
  };

  /* ---- recettes générées : dépendent du tier / enchant ---- */
  const TYPE = { raw:'Ressource brute', refined:'Raffinage', craft:'Craft' };
  const KIND_DESC = {
    raw: 'Ressource brute, récoltée dans les zones correspondantes. Pas de recette de craft : on la récolte ou on l\'achète.',
    refined: 'Matériau raffiné à partir de la ressource brute du même tier.',
    craft: 'Objet fabriqué en atelier à partir de matériaux raffinés (et d\'un journal).',
  };

  const recipeFor = itId => {
    const p = parseId(itId);
    const f = FAMILIES[p.family];
    if (!f || f.kind === 'raw') return null;
    const mkIng = fam => itemId(fam, p.tier, p.enchant);
    let ingredients = null;
    if (f.kind === 'refined') ingredients = [[mkIng(f.from), 3]];
    else if (f.recipe) ingredients = f.recipe.map(([fam, qty]) => [mkIng(fam), qty]);
    return {
      id: itId,
      name: f.name,
      type: TYPE[f.kind],
      desc: KIND_DESC[f.kind],
      timeSec: f.timeSec || 0,
      ingredients: ingredients || [],
      journal: itemId('JOURNAL_' + f.journal, p.tier),
      out: itId,
      quality: true,
    };
  };

  const recipeProducing = itemId => recipeFor(itemId);

  /* Inverse de recipeFor : quelles familles utilisent cet item comme ingrédient (ou son journal). */
  const usedIn = itId => {
    const p = parseId(itId);
    const users = [];
    Object.keys(FAMILIES).forEach(f => {
      const ff = FAMILIES[f];
      if (ff.recipe && ff.recipe.some(([ing]) => ing === p.family)) users.push(f);
      else if (ff.from === p.family) users.push(f);
      else if (ff.journal && 'JOURNAL_' + ff.journal === p.family) users.push(f);
    });
    return users.map(f => itemId(f, p.tier, p.enchant));
  };

  /* ---- sources d'approvisionnement ---- */
  const SOURCES = { buy:'buy', craft:'craft', gather:'gather' };
  const defaultSource = fam => FAMILIES[fam].kind === 'raw' ? 'gather' : (FAMILIES[fam].kind === 'refined' ? 'craft' : 'buy');
  const defaultSources = () => {
    const m = {};
    Object.keys(FAMILIES).forEach(f => m[f] = defaultSource(f));
    Object.keys(JOURNAL).forEach(j => m['JOURNAL_' + j] = 'buy');
    return m;
  };

  const sourceOptions = itemId => {
    const opts = ['buy'];
    const f = FAMILIES[parseId(itemId).family];
    if (f && f.kind !== 'raw') opts.push('craft');
    if (f && f.kind === 'raw') opts.push('gather');
    return opts;
  };

  const DEFAULTS = {
    selection: { family: 'MAIN_SWORD', tier: 'T4', enchant: 0, quality: 'ev' },
    quantity: 100, focus: false,
    stationFeePct: 25, marketTaxPct: 4, journalCounted: true,
    returnNoFocus: 0.20, returnWithFocus: 0.65,
    sense: 'instant', sources: defaultSources(),
  };

  const sourceOf = (s, itemId) => s.sources[parseId(itemId).family] || defaultSource(parseId(itemId).family);

  /* ---- Calcul récursif : une recette est un arbre ---- */
  const MAX_DEPTH = 6;

  const computeIngredient = (itemId, qty, s, depth) => {
    const source = sourceOf(s, itemId);
    if (source === 'gather')
      return { item: itemId, source, qty, cost: 0, timeSec: 0, children: [] };
    if (source === 'craft' && depth < MAX_DEPTH) {
      const sub = recipeProducing(itemId);
      if (sub) {
        const node = computeRecipe(sub, qty, s, depth + 1);
        return { item: itemId, source, qty, sub, cost: node.cost, timeSec: node.timeSec, children: node.children };
      }
    }
    return { item: itemId, source: 'buy', qty, cost: priceOf(itemId, 'buy', s.sense) * qty, timeSec: 0, children: [] };
  };

  const computeRecipe = (recipe, qty, s, depth) => {
    const ingNodes = recipe.ingredients.map(([id, iqty]) => computeIngredient(id, iqty * qty, s, depth));
    const gross = ingNodes.reduce((t, n) => t + n.cost, 0);
    const rate = s.focus ? s.returnWithFocus : s.returnNoFocus;
    const net = gross * (1 - rate);
    const fee = gross * s.stationFeePct / 100;
    const journ = recipe.journal && s.journalCounted ? priceOf(recipe.journal, 'buy', s.sense) * qty : 0;
    return {
      recipe, qty, ingNodes, gross, rate, net, fee, journ,
      cost: net + fee + journ,
      timeSec: recipe.timeSec * qty + ingNodes.reduce((t, n) => t + n.timeSec, 0),
    };
  };

  const compute = (s) => {
    const sel = s.selection;
    const outId = itemId(sel.family, sel.tier, sel.enchant);
    const recipe = recipeFor(outId);
    const isRaw = !recipe;
    const node = isRaw
      ? { recipe: null, qty: s.quantity, ingNodes: [], gross: 0, rate: 0, net: 0, fee: 0, journ: 0, cost: 0, timeSec: 0 }
      : computeRecipe(recipe, s.quantity, s, 0);
    const sellPerUnit = sel.quality === 'ev'
      ? evPrice(outId, 'sell', s)
      : qPrice(outId, 'sell', sel.quality, s.sense);
    const revGross = sellPerUnit * s.quantity;
    const tax = revGross * s.marketTaxPct / 100;
    const profit = revGross - tax - node.cost;
    const secTotal = node.timeSec;
    const perHour = secTotal > 0 ? profit / (secTotal / 3600) : 0;
    const buyCostPerUnit = sel.quality === 'ev'
      ? evPrice(outId, 'buy', { ...s, sense: 'instant' })
      : qPrice(outId, 'buy', sel.quality, 'instant');
    const craftVsBuy = buyCostPerUnit - node.cost / s.quantity;
    return { recipe, outId, isRaw, node, rc: { gross: node.gross, rate: node.rate, net: node.net },
      fee: node.fee, journ: node.journ, cost: node.cost, sellPerUnit, revGross, tax, profit,
      perUnitProfit: profit / s.quantity, perHour, secTotal,
      craftCostPerUnit: node.cost / s.quantity, buyCostPerUnit, craftVsBuy };
  };

  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

  const reduce = (s, action) => {
    switch (action.type) {
      case 'TOGGLE_FOCUS':    return { ...s, focus: !s.focus };
      case 'TOGGLE_SENSE':    return { ...s, sense: s.sense === 'instant' ? 'orders' : 'instant' };
      case 'TOGGLE_JOURNAL':  return { ...s, journalCounted: !s.journalCounted };
      case 'SET_STATION_FEE': return { ...s, stationFeePct: clamp(action.value, 0, 100) };
      case 'SET_TAX':         return { ...s, marketTaxPct: clamp(action.value, 0, 100) };
      case 'SET_QTY':         return { ...s, quantity: clamp(Math.round(action.value), 1, 10000) };
      case 'SET_SELECTION':   return { ...s, selection: { ...s.selection, ...action.value } };
      case 'SET_SOURCE':      return { ...s, sources: { ...s.sources, [action.family]: action.source } };
      case 'RESET':           return { ...DEFAULTS, sources: defaultSources() };
      default:                return s;
    }
  };

  return { DEFAULTS, TIERS, TIER_MULT, ENCHANTS, ENCHANT_MULT, QUALITY_PROBS, QUALITY_MULT, JOURNAL, FAMILIES, CATALOG, GATHERABLE, SOURCES,
    itemId, parseId, isJournal, priceOf, qPrice, evPrice, recipeFor, recipeProducing, sourceOptions, sourceOf, defaultSources,
    compute, computeRecipe, computeIngredient, reduce, usedIn };
})();

/* ============================================================
   PAGE — trois variantes d'interface sur le même moteur Calc.
   ============================================================ */
const fmt = n => Math.round(n).toLocaleString('fr-FR');
const money = n => `<span class="money">${fmt(n)} Silver</span>`;
const fmtTime = sec => {
  sec = Math.round(sec || 0);
  if (sec < 60) return `${sec}s`;
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return `${h}h ${m}m${s ? ' ' + s + 's' : ''}`;
  return `${m}min ${s ? s + 's' : ''}`.trim();
};
const timeOf = sec => `<span class="time"><i>⏱</i>${fmtTime(sec)}</span>`;
const qtyStepper = s => `
  <span class="stepper">
    <button onclick="actions.qty(-50)">−</button>
    <input class="qty" inputmode="numeric" pattern="[0-9]*" value="${s.quantity}" aria-label="Quantité"
      onchange="actions.setQty(this.value)">
    <button onclick="actions.qty(50)">+</button>
  </span>`;
const cls = n => n >= 0 ? 'pos' : 'neg';
const verdict = n => n >= 0 ? 'Rentable' : 'Pas rentable';
const iconOf = fam => 'img/T4_' + fam + '.png';
const tip = (t, title) => `<span class="tip" tabindex="0" data-tip="${t}" aria-label="Aide${title ? ' : ' + title : ''}">?</span>`;

const KIND_LABEL = {
  raw: 'Ressource brute', refined: 'Raffinage', craft: 'Craft',
  JOURNAL: 'Journal', none: 'Item',
};

/* Nom + type lisible pour un item (gère les journaux). */
function famNameOf(fam) {
  if (Calc.FAMILIES[fam]) return Calc.FAMILIES[fam].name;
  if (fam.indexOf('JOURNAL_') === 0) {
    const prof = fam.slice('JOURNAL_'.length);
    return Calc.JOURNAL[prof] ? Calc.JOURNAL[prof].name : fam;
  }
  return fam;
}
function kindOf(fam) {
  const f = Calc.FAMILIES[fam];
  return f ? KIND_LABEL[f.kind] : (fam.indexOf('JOURNAL_') === 0 ? KIND_LABEL.JOURNAL : KIND_LABEL.none);
}

/* Infobulle : nom, id, type, tier, enchant, qualité, prix achat/vente. */
function ibox(id, small) {
  const p = Calc.parseId(id);
  const q = state.selection.quality;
  const priceBuy = q === 'ev' ? Calc.evPrice(id, 'buy', state) : Calc.qPrice(id, 'buy', q, state.sense);
  const priceSell = q === 'ev' ? Calc.evPrice(id, 'sell', state) : Calc.qPrice(id, 'sell', q, state.sense);
  const qLbl = q === 'ev' ? 'EV (pondérée)' : 'Qualité Q' + q;
  const tierEnch = p.tier + (p.enchant ? ' .' + p.enchant : '');
  return `
    <div class="ibox">
      <div class="ib-name">${famNameOf(p.family)}</div>
      <div class="ib-id">${id}</div>
      <div class="ib-kind">${kindOf(p.family)} · ${tierEnch}${p.enchant ? tip('Enchantement : bonus de prix appliqué à l\'item.') : ''}</div>
      <div class="ib-row"><span class="k">${qLbl}${tip('Qualité prise en compte pour le prix affiché (EV = moyenne pondérée des probabilités).')}</span></div>
      <div class="ib-row"><span class="k">Achat</span><span class="v">${money(priceBuy)}</span></div>
      <div class="ib-row"><span class="k">Vente</span><span class="v">${money(priceSell)}</span></div>
    </div>`;
}

/* Icône cliquable + hoverable. Au clic : popup avec détails. */

const iconRow = ids => ids.map(id => icon(id, true)).join(' ');

let state = { ...Calc.DEFAULTS, sources: { ...Calc.DEFAULTS.sources } };
let current = (new URLSearchParams(location.search).get('variant') || 'A').toUpperCase();
if (!['A','B','C'].includes(current)) current = 'A';
let browserPath = []; /* pile de {id,name} dans CATALOG */

const VARIANTS = [
  { key:'A', name:'Verdict' },

  { key:'C', name:'Tableau de bord' },
];

const actions = {
  focus:  () => act({ type: 'TOGGLE_FOCUS' }),
  sense:  () => act({ type: 'TOGGLE_SENSE' }),
  journal:() => act({ type: 'TOGGLE_JOURNAL' }),
  station: d => act({ type: 'SET_STATION_FEE', value: state.stationFeePct + d }),

  setQty:  v => { const n = parseInt(v, 10); if (!isNaN(n) && n >= 1) act({ type: 'SET_QTY', value: n }); },
  setSel:  v => act({ type: 'SET_SELECTION', value: v }),
  reset:   () => { browserPath = []; closeModal(); if (typeof bStep !== 'undefined') bStep = 1; act({ type: 'RESET' }); },
};

function act(a) { state = Calc.reduce(state, a); render(); }

/* ---------- navigateur d'items ---------- */
function nodeAt(path) {
  let n = { subs: Calc.CATALOG };
  for (const c of path) n = n.subs.find(x => x.id === c.id);
  return n;
}
function browsePush(node) { browserPath.push({ id: node.id, name: node.name }); render(); }
function browsePop() { browserPath.pop(); render(); }
function browseTo(i) { browserPath = browserPath.slice(0, i + 1); render(); }

function crumbHtml() {
  const crumbs = browserPath.map((c, i) =>
    `<button class="${i === browserPath.length - 1 ? 'on' : ''}" onclick="browseTo(${i})">${c.name}</button>`).join('<span class="sep">›</span>');
  return `<div class="crumb"><button class="${browserPath.length ? '' : 'on'}" onclick="browseTo(-1)">Tout</button>${browserPath.length ? '<span class="sep">›</span>' : ''}${crumbs}</div>`;
}

function browserHtml(s) {
  const sel = s.selection;
  const node = nodeAt(browserPath);
  const fam = Calc.FAMILIES[sel.family];
  const outId = Calc.itemId(sel.family, sel.tier, sel.enchant);

  let tiles = '';
  if (node.subs) {
    tiles = node.subs.map(sub => `
      <button class="btile" onclick="browsePush({id:'${sub.id}',name:'${sub.name}'})">
        <img class="ic-sm" src="${iconOf(sub.icon || (sub.items ? sub.items[0] : 'ORE'))}" alt="">
        <span class="t-n">${sub.name}</span><span class="go">›</span>
      </button>`).join('');
  } else if (node.items) {
    tiles = node.items.map(f => {
      const item = Calc.itemId(f, sel.tier, sel.enchant);
      return `
      <button class="btile ${sel.family === f ? 'sel' : ''}" onclick="actions.setSel({family:'${f}'})">
        ${icon(item, true)}
        <span class="t-n">${Calc.FAMILIES[f].name}</span>
        <span class="t-d">${Calc.TYPE ? '' : ''}${famNameKind(f)}</span>
        ${sel.family === f ? '<span class="go accent">✓</span>' : ''}
      </button>`;
    }).join('');
  }

  const chips = (lbl, opts, cur, setFn, fmtChip) => `
    <div class="chips">
      <span class="lbl">${lbl}${tip('Niveau (tier) de l\'item : plus le tier est haut, plus les prix et le temps augmentent.', lbl)}</span>
      ${opts.map(o => `<button class="chip ${o === cur ? 'on' : ''}" onclick="${setFn}('${o}')">${fmtChip(o)}</button>`).join('')}
    </div>`;

  return `
    <div class="card">
      <h3>Sélection de l'item${tip('Navigue par catégorie puis choisis un item. Les mêmes options de craft s\'appliquent à tous les tiers / enchantements.', 'Sélection')}</h3>
      <div class="selbar">
        ${icon(outId)}
        <div><div class="s-name">${fam.name}</div><div class="s-id">${outId}</div></div>
        <button class="reset" onclick="actions.reset()">↺ Reset${tip('Remet la sélection, les sources et tous les réglages à leurs valeurs par défaut.', 'Reset')}</button>
      </div>
      ${crumbHtml()}
      <div class="btiles">${tiles}</div>
      <div style="margin-top:12px">
        ${chips('Tier', Calc.TIERS, sel.tier, 'actions.setSel({tier:', o => o)}
        <div style="height:8px"></div>
        ${chips('Enchant', Calc.ENCHANTS, sel.enchant, 'actions.setSel({enchant:', o => '.' + o)}
        <div style="height:8px"></div>
        <div class="chips">
          <span class="lbl">Qualité${tip('Qualité visée pour la vente. EV = espérance de valeur, chaque qualité pondérée par sa probabilité de sortie.', 'Qualité')}</span>
          <button class="chip ${sel.quality === 'ev' ? 'on' : ''}" onclick="actions.setSel({quality:'ev'})">EV</button>
          ${[1,2,3,4,5].map(q => `<button class="chip ${sel.quality === q ? 'on' : ''}" onclick="actions.setSel({quality:${q}})" data-q="${q}">Q${q}</button>`).join('')}
        </div>
      </div>
    </div>`;
}
function famNameKind(f) {
  const k = Calc.FAMILIES[f].kind;
  return { raw:'ressource', refined:'raffiné', craft:'fabriqué' }[k];
}

/* ---------- détail du calcul ---------- */
function breakdown(res, s) {
  return `
    <div class="row"><span>Ressources (brut)${tip('Coût des ingrédients, selon la source choisie pour chacun (acheté, crafté ou récolté).')}</span><span class="val">${money(res.rc.gross)}</span></div>
    <div class="row"><span>Retour ressources (${res.rc.rate*100}%)${tip('En craftant tu récupères une partie des ingrédients (sans focus ≈20%, avec focus ≈65%). C\'est la somme que tu ne dépenses pas.')}</span><span class="val">− ${money(res.rc.gross - res.rc.net)}</span></div>
    <div class="row"><span>Frais de station (${s.stationFeePct}%)${tip('Pourcentage payé à la ville pour utiliser son atelier. Plus le chantier est fréquenté, plus il est cher.')}</span><span class="val">− ${money(res.fee)}</span></div>
    ${res.journ > 0 ? `<div class="row"><span>Journaux${tip('Un journal de métier est consommé à chaque craft (recharge la moitié de la valeur des ingrédients au refinage/collecte).')}</span><span class="val">− ${money(res.journ)}</span></div>` : ''}
    <div class="row"><span>Taxe de marché (${s.marketTaxPct}%)${tip('Prélevée par la ville quand tu vends à l\'enchère (frais de mise en vente + commission).')}</span><span class="val">− ${money(res.tax)}</span></div>
    <div class="row"><span class="accent">Coût total${tip('Ressources nettes + frais de station + journaux + taxe de marché.')}</span><span class="val accent">${money(res.cost)}</span></div>
    <div class="row"><span>Revenu (${s.selection.quality === 'ev' ? 'EV' : 'Q' + s.selection.quality})${tip(s.selection.quality === 'ev' ? 'EV = Espérance de valeur : prix de vente moyen, chaque qualité étant pondérée par sa probabilité.' : 'Revenu calculé avec la qualité sélectionnée.')}</span><span class="val">${money(res.revGross)}</span></div>
  `;
}

function qualityTable(res, s) {
  const probs = s.focus ? Calc.QUALITY_PROBS.withFocus : Calc.QUALITY_PROBS.noFocus;
  const side = s.sense === 'instant' ? 'bid' : 'ask';
  return `
    <table>
      <tr><th>Qualité</th><th>Proba</th><th>Prix (${side})</th></tr>
      ${[1,2,3,4,5].map(q => `<tr><td>Q${q}</td><td>${(probs[q]*100).toFixed(1)}%</td><td class="num">${money(Calc.qPrice(res.outId, 'sell', q, s.sense))}</td></tr>`).join('')}
      <tr class="accent"><td>Prix moyen (EV)</td><td>—</td><td class="num">${money(Calc.evPrice(res.outId, 'sell', s))}</td></tr>
    </table>`;
}

/* ---------- Popup item : icône agrandie + 3 onglets ---------- */
let modalItem = null;
let modalTab = 'details';

function openModal(id) { modalItem = id; modalTab = 'details'; renderModal(); }
function setModalTab(t) { modalTab = t; renderModal(); }
function closeModal() { modalItem = null; renderModal(); }
function modalRoot() { return document.getElementById('modal'); }

function modalTabTitle(t, id) {
  if (t === 'details') return 'Détails';
  const rec = Calc.recipeFor(id);
  if (t === 'recipe') return `Exigences de fabrication (${rec && rec.ingredients.length ? rec.ingredients.length + (rec.journal ? 1 : 0) : 0})`;
  const used = Calc.usedIn(id);
  return `Utilisé dans (${used.length})`;
}

function modalRecipeRows(id) {
  const rec = Calc.recipeFor(id);
  if (!rec || !rec.ingredients.length) {
    return `<div class="mnote">Aucune recette de craft : c'est une ressource ${Calc.FAMILIES[Calc.parseId(id).family] && Calc.FAMILIES[Calc.parseId(id).family].kind === 'raw' ? 'récoltable' : ''}, à acheter ou récolter.</div>`;
  }
  const rows = rec.ingredients.map(([ingId, qty]) => {
    const p = Calc.parseId(ingId);
    return `
      <div class="ing-row">
        ${icon(ingId, true)}
        <div class="ir-name">${famNameOf(p.family)}<div class="ir-id">${ingId} × ${qty}</div></div>
        <div class="ir-qty">×${qty}</div>
      </div>`;
  }).join('');
  const journ = rec.journal ? `
    <div class="ing-row">
      ${icon(rec.journal, true)}
      <div class="ir-name">${famNameOf(Calc.parseId(rec.journal).family)}<div class="ir-id">${rec.journal} × 1</div></div>
      <div class="ir-qty">×1</div>
    </div>` : '';
  return `<div class="mcard">${rows}${journ}</div>
    <div class="mnote">Temps de craft : ${timeOf(rec.timeSec)}${rec.journal ? ' · 1 journal consommé par unité' : ''}</div>`;
}

function modalUsedRows(id) {
  const used = Calc.usedIn(id);
  if (!used.length) return `<div class="mnote">Cet item n'est utilisé dans aucune recette du catalogue.</div>`;
  return `<div class="mcard">${used.map(u => {
    const p = Calc.parseId(u);
    return `
      <div class="used-row">
        ${icon(u, true)}
        <div class="ur-name">${famNameOf(p.family)}<div class="ur-kind">${kindOf(p.family)} · utilisé comme ingrédient</div></div>
        <button onclick="openModal('${u}')">Voir</button>
      </div>`;
  }).join('')}</div>`;
}

function modalDetails(id) {

  const fam = Calc.FAMILIES[p.family];
  const q = state.selection.quality;

  const isRaw = fam && fam.kind === 'raw';
  return `

      ${isRaw ? `<div class="ing-row"><span class="ir-name">Récoltable</span><span class="ir-qty pos">Oui${tip('Récoltable en zone appropriée, coût d\'approvisionnement nul si source = récolte.')}</span></div>` : ''}
      <div class="ing-row"><span class="ir-name">Qualité visée</span><span class="ir-qty">${q === 'ev' ? 'EV (pondérée)' : 'Q' + q}</span></div>
      <div class="ing-row"><span class="ir-name">Prix achat</span><span class="ir-qty">${money(priceBuy)}</span></div>

}

function modalHtml(id) {
  const p = Calc.parseId(id);
  const q = state.selection.quality;
  const priceBuy = q === 'ev' ? Calc.evPrice(id, 'buy', state) : Calc.qPrice(id, 'buy', q, state.sense);
  const priceSell = q === 'ev' ? Calc.evPrice(id, 'sell', state) : Calc.qPrice(id, 'sell', q, state.sense);
  const tabs = [['details', 'Détails'], ['recipe', `Exigences de fabrication (${Calc.recipeFor(id) && Calc.recipeFor(id).ingredients.length ? Calc.recipeFor(id).ingredients.length + (Calc.recipeFor(id).journal ? 1 : 0) : 0})`], ['used', `Utilisé dans (${Calc.usedIn(id).length})`]];
  return `
    <div class="mback" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="mhead">
          <img src="${iconOf(p.family)}" alt="${id}">
          <div class="mtitle">
            <div class="mn">${famNameOf(p.family)}</div>
            <div class="mid">${id}</div>
            <div class="mid" style="margin-top:2px">Achat : ${money(priceBuy)} · Vente : ${money(priceSell)}</div>
          </div>
          <button class="mclose" onclick="closeModal()" aria-label="Fermer">×</button>
        </div>
        <div class="mtabs">
          ${tabs.map(([t, lbl]) => `<button class="${modalTab === t ? 'on' : ''}" onclick="setModalTab('${t}')">${lbl}</button>`).join('')}
        </div>
        ${modalTab === 'details' ? modalDetails(id) : (modalTab === 'recipe' ? modalRecipeRows(id) : modalUsedRows(id))}
      </div>
    </div>`;
}

function renderModal() {
  const root = modalRoot();
  if (!root) return;
  if (!modalItem) { root.innerHTML = ''; return; }
  root.innerHTML = modalHtml(modalItem);
}

function sourceBtn(fam, source, label) {
  const on = sourceOf(fam) === source;
  return `<button class="${on?'on':''}" onclick="act({type:'SET_SOURCE', family:'${fam}', source:'${source}'})">${label}</button>`;
}

const SOURCE_LABEL = { buy:'Acheter', craft:'Crafter', gather:'Récolter' };

function sourceOf(fam) { return state.sources[fam] || Calc.defaultSources()[fam]; }

function famName(id) {
  const fam = Calc.parseId(id).family;
  if (fam.indexOf('JOURNAL_') === 0) {
    const prof = fam.slice('JOURNAL_'.length);
    return Calc.JOURNAL[prof] ? Calc.JOURNAL[prof].name : fam;
  }
  return Calc.FAMILIES[fam] ? Calc.FAMILIES[fam].name : fam;
}

/* Rend un ingrédient + ses sous-ingrédients (récursif) */
function ingNode(itemId, qty, depth) {
  const fam = Calc.parseId(itemId).family;
  const src = sourceOf(fam);
  const sub = Calc.recipeProducing(itemId);
  const srcBtns = Calc.sourceOptions(itemId).map(o => sourceBtn(fam, o, SOURCE_LABEL[o])).join('');
  let subHtml = '';
  if (src === 'craft' && sub && sub.ingredients.length) {
    const subIngs = sub.ingredients.map(([id, q]) => ingNode(id, q * qty, depth + 1)).join('');
    const subJourn = sub.journal && state.journalCounted
      ? `<div class="ingr-sum">${icon(sub.journal, true)} ${sub.journal} × ${qty}</div>` : '';
    subHtml = `<div class="branch">
      <div class="node-sub">↳ ${sub.name} <span style="color:var(--muted)">(${sub.type})</span></div>
      ${subIngs}${subJourn}
    </div>`;
  }
  return `
    <div class="node" style="margin-left:${depth * 18}px">
      <div class="node-head">
        <div class="node-label">${icon(itemId, true)} <span class="node-name">${famName(itemId)} (${fam}) × ${qty}</span>
          <span class="src">${srcBtns}</span></div>
        <span class="node-cost">${money(ingCost(itemId, qty))}</span>
      </div>
      ${subHtml}
    </div>`;
}

/* Coût réel d'un ingrédient selon sa source (partagé avec le moteur) */
function ingCost(itemId, qty) {
  const fam = Calc.parseId(itemId).family;
  const src = sourceOf(fam);
  if (src === 'gather') return 0;
  if (src === 'craft') {
    const sub = Calc.recipeProducing(itemId);
    if (sub && sub.ingredients.length) {
      const node = Calc.computeRecipe(sub, qty, state, 1);
      return node.cost;
    }
  }
  return Calc.priceOf(itemId, 'buy', state.sense) * qty;
}

function ingredientsTree(res, s) {
  if (res.isRaw) return `<div class="hint" style="padding:6px 0">Ressource brute : pas de recette, à récolter ou à acheter.</div>`;
  const totalQty = res.recipe.ingredients.map(([id, qty]) => ingNode(id, qty * s.quantity, 0)).join('');
  const journal = res.recipe.journal && s.journalCounted ? ingNode(res.recipe.journal, s.quantity, 0) : '';
  return `<div class="tree">${totalQty}${journal}</div>`;
}

      <button class="btn primary block" onclick="goB(3)">Voir le résultat</button>`;
  } else {
    body = `
      <div class="topbar"><div class="title">Résultat</div></div>
      <div class="card big-verdict">
        <div class="hint">Silver / heure${tip('Argent gagné en 1h de craft, basé sur le temps réel d\'un craft.')}</div>
        <div class="num-big ${cls(res.perHour)}">${money(res.perHour)}</div>
        <div style="margin-top:6px" class="${cls(res.profit)}" style="font-size:1rem;font-weight:700">${verdict(res.profit)}</div>
        <div class="hint" style="margin-top:4px">${money(res.profit)} sur ${s.quantity} unités · ${money(res.perUnitProfit)}/unité</div>
        <div style="margin-top:10px;display:flex;justify-content:center;gap:10px;align-items:center">
          <span class="time">${fmtTime(res.secTotal)}</span>
          <span class="hint">durée du lot</span>
        </div>
      </div>
      <div class="card">
        <h3>Détail</h3>
        ${breakdown(res, s)}
        <details><summary>Qualité (valeur attendue)</summary><div class="inset">${qualityTable(res, s)}</div></details>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="goB(2)">← Modifier</button>
        <button class="btn primary" onclick="goB(1)">Autre item</button>
      </div>`;
  }
  return `<div class="progress">${dots}</div>${body}`;
}
function goB(n) { bStep = n; render(); }

/* ---------- Variante C — tableau de bord comparatif par tier ---------- */
function variantC(res, s) {
  const famName = Calc.FAMILIES[s.selection.family].name;
  const cards = Calc.TIERS.map(tier => {
    const ss = { ...s, selection: { ...s.selection, tier } };
    const rr = Calc.compute(ss);
    return `
      <div class="card">
        <div class="mini">
          ${icon(rr.outId)}
          <div>
            <div style="font-weight:700">${famName} ${tier}${s.selection.enchant ? '.' + s.selection.enchant : ''}</div>
            <div class="hint">${rr.isRaw ? 'ressource' : rr.recipe.type} · ${timeOf(rr.secTotal)} · ${money(rr.perUnitProfit)}/unité</div>
          </div>
          <span class="pill ${cls(rr.craftVsBuy)}">${rr.craftVsBuy >= 0 ? 'craft < achat' : 'achat < craft'}${tip(rr.craftVsBuy >= 0 ? 'Craft plus rentable que l\'achat direct.' : 'Acheter directement coûte moins cher que crafter.')}</span>
        </div>
        <div class="tiles" style="margin-top:10px">
          <div class="tile"><div class="k">Profit${tip('Revenu − coût total.')}</div><div class="v ${cls(rr.profit)}">${money(rr.profit)}</div></div>
          <div class="tile"><div class="k">Silver/h${tip('Argent gagné en 1h de craft.')}</div><div class="v ${cls(rr.perHour)}">${money(rr.perHour)}</div></div>
        </div>
        <details><summary>Détail${tip('Déroule pour voir la recette et ajuster la source de chaque ingrédient.')}</summary>
          <div class="inset">
            ${breakdown(rr, ss)}
            <div class="tree" style="margin-top:8px">${ingredientsTree(rr, ss)}</div>
          </div>
        </details>
      </div>`;
  }).join('');

  return `
    <div class="side">
      ${browserHtml(s)}
      <div class="card">
        <h3>Réglages communs${tip('Appliqués à tous les tiers affichés en dessous.')}</h3>
        <div class="row"><span>Quantité${tip('Nombre d\'unités craftées dans ce lot. Clique sur la valeur pour la saisir.')}</span>
          ${qtyStepper(s)}</div>
        <div class="row"><span>Focus${tip('Améliore le retour de ressources et les chances de haute qualité.')}</span>
          <label class="switch"><input type="checkbox" ${s.focus?'checked':''} onchange="actions.focus()"><span class="sl"></span></label></div>
        <div class="row"><span>Sens${tip('Instantané = prix affiché. Ordres = meilleurs prix mais il faut attendre.')}</span>
          <span class="seg"><button class="${s.sense==='instant'?'on':''}" onclick="act({type:'TOGGLE_SENSE'})">Instantané</button><button class="${s.sense==='orders'?'on':''}" onclick="act({type:'TOGGLE_SENSE'})">Ordres</button></span></div>
        <div class="row"><span>Frais de station${tip('Pourcentage payé à la ville pour utiliser son atelier.')}</span>
          <span class="stepper"><button onclick="actions.station(-5)">−</button><span class="val">${s.stationFeePct}%</span><button onclick="actions.station(5)">+</button></span></div>
      </div>
    </div>
    <div class="topbar"><div class="title">Comparer les tiers de ${famName}${tip('Compare le même item à tous les tiers, avec les réglages appliqués à tous. Enchantement et qualité restent ceux sélectionnés.')}</div></div>
    <div class="banner">Le but de cette page : comparer d'un coup d'œil quel tier est le plus rentable.</div>
    ${cards}`;
}

/* ---------- bascule de variantes ---------- */
function render() {
  const res = Calc.compute(state);
  const s = state;
  const html = { A: variantA(res, s), B: variantB(res, s), C: variantC(res, s) }[current];
  const app = document.getElementById('app');
  app.className = current === 'B' ? 'solo' : 'layout';
  app.innerHTML = html;
  const v = VARIANTS.find(x => x.key === current);
  document.getElementById('lbl').textContent = `${v.key} — ${v.name}`;
  renderModal();
}

function setVariant(i) {
  current = VARIANTS[i].key;
  history.replaceState(null, '', '?variant=' + current);
  closeModal();
  render();
}

document.getElementById('prev').onclick = () => {
  const i = VARIANTS.findIndex(x => x.key === current);
  setVariant((i - 1 + VARIANTS.length) % VARIANTS.length);
};
document.getElementById('next').onclick = () => {
  const i = VARIANTS.findIndex(x => x.key === current);
  setVariant((i + 1) % VARIANTS.length);
};

window.addEventListener('keydown', (e) => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const i = VARIANTS.findIndex(x => x.key === current);
    setVariant(e.key === 'ArrowLeft' ? (i - 1 + VARIANTS.length) % VARIANTS.length : (i + 1) % VARIANTS.length);
  }
});

render();
</script>
</body>
</html>
